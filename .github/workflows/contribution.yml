name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate Contribution Games
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Pac-Man and arcade games
      - name: Generate Arcade Contribution Games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper"

      # Snake
      - name: Generate Snake Contribution Graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Tetris
      - name: Generate Tetris Contributions
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          animation_mode: tetromino
          tetromino_count: "5"
          output_path: dist/contribution-graph-tetrominoes.svg
          palette: auto

      # Publish arcade games, Snake, and Tetris
      - name: Publish Contribution Animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  space-invaders:
    name: Generate Space Invaders
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checkout the existing output branch directly.
      # This avoids conflicts when the SVG files already exist.
      - name: Checkout Invaders Branch
        uses: actions/checkout@v4
        with:
          ref: invaders-output
          fetch-depth: 0
          persist-credentials: true

      - name: Generate Space Invaders
        uses: Goblinlordx/commit-invaders@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_user_name: ${{ github.repository_owner }}
          output_branch: invaders-output
